name: JRSI reviewer reanalysis

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download filtered public dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          curl --retry 4 --retry-delay 3 --fail -L \
            'https://data.mendeley.com/public-api/zip/r8gmbtv7w2/download/3' \
            -o work/fog_filtered_v3.zip
          ls -lh work/fog_filtered_v3.zip
          unzip -l work/fog_filtered_v3.zip > work/zip_manifest.txt
          sed -n '1,220p' work/zip_manifest.txt
          mkdir -p work/data
          unzip -q work/fog_filtered_v3.zip -d work/data
          echo '=== top-level tree ==='
          find work/data -maxdepth 5 -type f | sort | sed -n '1,300p'
          echo '=== sizes ==='
          du -sh work/data
          find work/data -type f -printf '%s %p\n' | sort -nr | head -n 50
          echo '=== representative text heads ==='
          find work/data -type f \( -iname '*.txt' -o -iname '*.csv' \) | sort | head -n 8 | while read f; do
            echo "--- $f ---"
            head -n 4 "$f" | cut -c1-1200
          done
      - name: Upload inspection manifest
        uses: actions/upload-artifact@v4
        with:
          name: fog-filtered-inspection
          path: work/zip_manifest.txt
          if-no-files-found: error
