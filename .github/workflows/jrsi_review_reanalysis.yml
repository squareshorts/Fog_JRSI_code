name: JRSI reviewer reanalysis

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reanalysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble analysis script
        shell: bash
        run: |
          set -euo pipefail
          cat analysis/reviewer_part_00.py analysis/reviewer_part_01.py analysis/reviewer_part_02.py analysis/reviewer_part_03.py > analysis/reviewer_reanalysis.py
          python -m py_compile analysis/reviewer_reanalysis.py analysis/continuous_onset_dynamics.py
      - name: Install dependencies
        run: python -m pip install -q numpy pandas scipy matplotlib statsmodels scikit-learn
      - name: Download filtered public dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/data
          curl --retry 4 --retry-delay 3 --fail -L 'https://data.mendeley.com/public-api/zip/r8gmbtv7w2/download/3' -o work/fog_filtered_v3.zip
          unzip -q work/fog_filtered_v3.zip -d work/data
          rm work/fog_filtered_v3.zip
      - name: Execute reviewer reanalysis
        shell: bash
        run: |
          set -euo pipefail
          python analysis/reviewer_reanalysis.py --data-root 'work/data/Filtered Data' --out work/results
          echo '=== REVIEWER REPORT ==='
          cat work/results/REPORT.md
      - name: Execute continuous onset dynamics
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=analysis python analysis/continuous_onset_dynamics.py --data-root 'work/data/Filtered Data' --out work/continuous --nperm 199
          echo '=== CONTINUOUS ONSET REPORT ==='
          cat work/continuous/REPORT_CONTINUOUS.md
      - name: Upload complete reanalysis results
        uses: actions/upload-artifact@v4
        with:
          name: jrsi-review-reanalysis-results
          path: |
            work/results
            work/continuous
          if-no-files-found: error
          compression-level: 6
