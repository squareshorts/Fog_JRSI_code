name: JRSI reviewer reanalysis

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe public files API
        shell: bash
        run: |
          set -euo pipefail
          for u in \
            'https://data.mendeley.com/public-api/datasets/r8gmbtv7w2/files?version=3' \
            'https://data.mendeley.com/public-api/datasets/r8gmbtv7w2/versions/3/files' \
            'https://data.mendeley.com/api/datasets-v2/r8gmbtv7w2/files?version=3' \
            'https://data.mendeley.com/api/datasets-v2/r8gmbtv7w2/versions/3/files' \
            'https://data.mendeley.com/public-api/datasets/r8gmbtv7w2?version=3'; do
            echo "=== $u ==="
            curl -L -sS -D /tmp/h -o /tmp/b "$u" || true
            head -n 1 /tmp/h
            head -c 20000 /tmp/b
            echo
          done
