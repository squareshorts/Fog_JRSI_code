name: JRSI reviewer reanalysis

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve public dataset files
        shell: bash
        run: |
          set -euo pipefail
          H='Accept: application/vnd.mendeley-public-dataset.1+json'
          u='https://data.mendeley.com/public-api/datasets/r8gmbtv7w2/files?folder_id=root&version=3'
          echo "=== root files ==="
          curl --max-time 30 -L -sS -H "$H" -D /tmp/h -o /tmp/b "$u"
          head -n 1 /tmp/h
          cat /tmp/b
          echo
          echo "=== archive headers ==="
          curl --max-time 30 -L -sS -I 'https://data.mendeley.com/public-api/zip/r8gmbtv7w2/download/3' || true
