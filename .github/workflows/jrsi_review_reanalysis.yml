name: JRSI reviewer reanalysis

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query public file tree
        shell: bash
        run: |
          set -euo pipefail
          for q in \
            'version=3&parent=root' \
            'version=3&page=1&limit=100&parent=root' \
            'version=3&folder=root' \
            'version=3&parent=' \
            'version=3&limit=100'; do
            u="https://data.mendeley.com/public-api/datasets/r8gmbtv7w2/files?$q"
            echo "=== $u ==="
            curl --max-time 20 -L -sS -D /tmp/h -o /tmp/b "$u" || true
            head -n 1 /tmp/h || true
            head -c 30000 /tmp/b || true
            echo
          done
          echo '=== bundle route strings ==='
          curl --max-time 30 -L -sS 'https://data.mendeley.com/datasets/bundle.js?ec45581598eb1337d2e2' -o /tmp/bundle.js || true
          grep -oE '.{0,180}(public-api|/files).{0,260}' /tmp/bundle.js | head -n 100 || true
